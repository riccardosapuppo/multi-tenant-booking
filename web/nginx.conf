# The interface and the API on one origin.
#
# Same origin on purpose: it means no CORS to configure, no preflight on every
# request, and — more to the point — that the X-Centre header the whole design
# turns on is never the thing a browser quietly drops.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A single-page application: every path that is not a file is the
    # application, which routes it itself.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Passed through explicitly rather than relied upon. This header is how
        # a request says which centre it is for, and a proxy that drops it
        # turns every call into "no centre given" — which is a 400 that looks
        # like an interface bug and is not one.
        proxy_set_header X-Centre $http_x_centre;
    }

    # Hashed filenames, so they can be cached hard. index.html cannot.
    location ~* \.(js|css|woff2?|png|svg|jpg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
