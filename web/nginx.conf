# The interface and the API on one origin.
#
# Same origin on purpose: it means no CORS to configure, no preflight on every
# request, and — more to the point — that the X-Centre header the whole design
# turns on is never the thing a browser quietly drops.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A single-page application: every path that is not a file is the
    # application, which routes it itself.
    #
    # The page is never cached, and the header is here rather than only on
    # `location = /index.html` — that block is not what serves it. A request for
    # `/` lands in this one and is rewritten by try_files, so the exact-match
    # location never runs and the page was cached with whatever default was in
    # effect. The symptom is somebody being served a build from days ago,
    # calling an API that has moved on, and seeing errors from a version that
    # no longer exists.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # A request that NAMES A FILE and does not find one is an error, and must
    # not be answered with the application.
    #
    # This is the trap in every SPA fallback, and it cost real time here. An
    # earlier version of this project installed an Angular service worker; a
    # service worker outlives the build that registered it and keeps serving its
    # own precached copy of the site, ahead of the network. The way out is that
    # the browser re-checks the worker's files and gives up when they are gone —
    # but `try_files ... /index.html` answered `/ngsw.json` with 200 and a page
    # of HTML. The worker asked whether it was out of date, was handed a
    # document instead of an answer, failed to read it, and carried on serving
    # a site from weeks ago. Every visit needed Ctrl+F5.
    #
    # `=404` is the whole fix, and it is worth having on its own account: a
    # missing script that arrives as HTML fails later, somewhere else, with a
    # syntax error on line 1 that says nothing about the file being absent.
    location ~* \.(js|mjs|css|map|json|txt|xml|webmanifest|woff2?|ttf|png|svg|jpe?g|gif|ico)$ {
        try_files $uri =404;

        # Hashed filenames, so these can be cached hard. index.html cannot.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Passed through explicitly rather than relied upon. This header is how
        # a request says which centre it is for, and a proxy that drops it
        # turns every call into "no centre given" — which is a 400 that looks
        # like an interface bug and is not one.
        proxy_set_header X-Centre $http_x_centre;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        # No validators either. With an ETag a browser holding an old copy can
        # ask "still this one?" and be told yes by a server that has since been
        # rebuilt to the same length — and a 304 revives a page that no longer
        # exists. The page is 3KB; there is nothing to save by validating it.
        etag off;
        if_modified_since off;
        add_header Last-Modified "";
    }
}
