<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    The same mark as shell/logo.component.ts: a day as a ring, with the booked
    part taken out of it. Kept as one file rather than exported to PNG so the
    tab icon and the header cannot drift apart.

    The colours are literal here and not custom properties: a favicon is loaded
    outside the page and inherits nothing from it. When the mark changes in the
    component it changes here too — which is checked by a test, because "keep
    two files in step by remembering" is not a plan.
  -->
  <rect width="32" height="32" rx="7" fill="#1f6f5c"/>
  <circle cx="16" cy="16" r="9.5" stroke="#7fc7b1" stroke-width="2.5" opacity="0.6"/>
  <circle cx="16" cy="16" r="9.5" stroke="#ffffff" stroke-width="6" stroke-linecap="butt" stroke-dasharray="10 50" transform="rotate(-90 16 16)"/>
</svg>
